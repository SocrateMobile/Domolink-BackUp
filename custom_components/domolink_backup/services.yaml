create_backup:
  name: "Créer et téléverser une sauvegarde"
  description: "Déclenche la création d'une sauvegarde Home Assistant et la téléverse immédiatement vers votre destination distante DomoLink-BackUp (NAS, WebDAV, Google Drive, Partage Réseau)."
  fields:
    name:
      name: "Nom de la sauvegarde"
      description: "Nom personnalisé pour la sauvegarde (optionnel)."
      example: "Sauvegarde Hebdo"
      selector:
        text:
    include_database:
      name: "Inclure la base de données"
      description: "Inclure la base de données de l'historique (Recorder) dans l'archive."
      default: true
      selector:
        boolean:
    backup_type:
      name: "Type de sauvegarde"
      description: "Sauvegarde complète de tout le système ('full') ou sauvegarde partielle / incrémentielle sélective ('partial')."
      default: "full"
      selector:
        select:
          options:
            - label: "Sauvegarde Complète (Full)"
              value: "full"
            - label: "Sauvegarde Partielle / Incrémentielle (Partial)"
              value: "partial"
    homeassistant:
      name: "Inclure Home Assistant Core"
      description: "Inclure la configuration et les automatisations de Home Assistant dans la sauvegarde partielle."
      default: true
      selector:
        boolean:
    include_integrations:
      name: "Inclure les intégrations personnalisées"
      description: "Inclure le dossier custom_components (intégrations HACS et tierces)."
      default: true
      selector:
        boolean:
    include_themes:
      name: "Inclure les thèmes d'interface"
      description: "Inclure le dossier themes (thèmes Lovelace)."
      default: true
      selector:
        boolean:
    include_blueprints:
      name: "Inclure les Blueprints"
      description: "Inclure le dossier blueprints (modèles d'automatisations et scripts)."
      default: true
      selector:
        boolean:
    addons:
      name: "Modules complémentaires (Add-ons)"
      description: "Liste des slugs d'add-ons à inclure dans la sauvegarde partielle (ex: ['core_mosquitto'])."
      selector:
        object:
    folders:
      name: "Dossiers partagés"
      description: "Liste des répertoires partagés à inclure (ex: ['share', 'ssl', 'media'])."
      selector:
        object:

upload_backup:
  name: "Téléverser un fichier de sauvegarde"
  description: "Téléverse un fichier d'archive (.tar) existant depuis Home Assistant vers la destination distante configurée."
  fields:
    file_path:
      name: "Chemin du fichier"
      description: "Chemin absolu vers le fichier d'archive à envoyer (ex. /backup/mon_archive.tar)."
      required: true
      example: "/backup/583920fa.tar"
      selector:
        text:

test_connection:
  name: "Tester la connexion au stockage"
  description: "Exécute un diagnostic complet de connexion et vérifie les permissions d'écriture sur le serveur distant (FTP, WebDAV, Google Drive ou Partage Local)."

clean_old_backups:
  name: "Nettoyer selon la rétention (Purge FIFO)"
  description: "Analyse les sauvegardes distantes et supprime les archives les plus anciennes dépassant vos règles de quotas (nombre max, âge max en jours, taille max en Mo)."

sync_backups:
  name: "Synchroniser les sauvegardes"
  description: "Interroge le serveur distant pour mettre à jour la liste des sauvegardes, l'espace utilisé et les capteurs d'état."

restore_backup:
  name: "Restaurer ou rapatrier une sauvegarde"
  description: "Télécharge une archive distante vers Home Assistant et peut soit l'enregistrer dans les sauvegardes du système, soit déclencher la restauration complète ou partielle."
  fields:
    filename:
      name: "Nom du fichier d'archive"
      description: "Nom de l'archive distante à restaurer (ex. 11-09-2026_BackUp.tar)."
      required: true
      example: "11-09-2026_10H22_BackUp_Home_Assistant_MANUEL.tar"
      selector:
        text:
    restore_mode:
      name: "Mode de restauration"
      description: "Rapatrier vers Home Assistant ('download_only'), restauration complète ('full_restore') ou restauration partielle ('partial_restore')."
      default: "download_only"
      selector:
        select:
          options:
            - label: "Rapatrier vers Home Assistant uniquement"
              value: "download_only"
            - label: "Restauration complète du système"
              value: "full_restore"
            - label: "Restauration partielle / incrémentielle (sélective)"
              value: "partial_restore"
    restore_homeassistant:
      name: "Restaurer Home Assistant Core"
      description: "Restaurer la configuration et les automatisations de Home Assistant."
      default: true
      selector:
        boolean:
    restore_integrations:
      name: "Restaurer les intégrations personnalisées"
      description: "Restaurer le dossier custom_components (intégrations HACS et tierces)."
      default: true
      selector:
        boolean:
    restore_themes:
      name: "Restaurer les thèmes Lovelace"
      description: "Restaurer le dossier themes."
      default: true
      selector:
        boolean:
    restore_blueprints:
      name: "Restaurer les Blueprints"
      description: "Restaurer le dossier blueprints."
      default: true
      selector:
        boolean:
    restore_addons:
      name: "Restaurer les Add-ons"
      description: "Liste des slugs d'add-ons à restaurer."
      selector:
        object:
    restore_folders:
      name: "Restaurer les dossiers"
      description: "Liste des dossiers à restaurer."
      selector:
        object:
