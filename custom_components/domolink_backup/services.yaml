create_backup:
  name: "Créer et téléverser une sauvegarde"
  description: "Déclenche la création d'une sauvegarde Home Assistant et la téléverse immédiatement vers votre destination distante DomoLink-BackUp (NAS, WebDAV, Google Drive, Partage Réseau)."
  fields:
    name:
      name: "Nom de la sauvegarde"
      description: "Nom personnalisé pour la sauvegarde (optionnel)."
      example: "Sauvegarde Hebdo"
      selector:
        text:
    include_database:
      name: "Inclure la base de données"
      description: "Inclure la base de données de l'historique (Recorder) dans l'archive."
      default: true
      selector:
        boolean:

upload_backup:
  name: "Téléverser un fichier de sauvegarde"
  description: "Téléverse un fichier d'archive (.tar) existant depuis Home Assistant vers la destination distante configurée."
  fields:
    file_path:
      name: "Chemin du fichier"
      description: "Chemin absolu vers le fichier d'archive à envoyer (ex. /backup/mon_archive.tar)."
      required: true
      example: "/backup/583920fa.tar"
      selector:
        text:

test_connection:
  name: "Tester la connexion au stockage"
  description: "Exécute un diagnostic complet de connexion et vérifie les permissions d'écriture sur le serveur distant (FTP, WebDAV, Google Drive ou Partage Local)."

clean_old_backups:
  name: "Nettoyer selon la rétention (Purge FIFO)"
  description: "Analyse les sauvegardes distantes et supprime les archives les plus anciennes dépassant vos règles de quotas (nombre max, âge max en jours, taille max en Mo)."

sync_backups:
  name: "Synchroniser les sauvegardes"
  description: "Interroge le serveur distant pour mettre à jour la liste des sauvegardes, l'espace utilisé et les capteurs d'état."

restore_backup:
  name: "Restaurer ou rapatrier une sauvegarde"
  description: "Télécharge une archive distante vers Home Assistant et peut soit l'enregistrer dans les sauvegardes du système, soit déclencher la restauration complète."
  fields:
    filename:
      name: "Nom du fichier d'archive"
      description: "Nom de l'archive distante à restaurer (ex. 11-09-2026_BackUp.tar)."
      required: true
      example: "11-09-2026_10H22_BackUp_Home_Assistant_MANUEL.tar"
      selector:
        text:
    restore_mode:
      name: "Mode de restauration"
      description: "Choisissez entre rapatrier vers Home Assistant ('download_only') ou exécuter une restauration complète ('full_restore')."
      default: "download_only"
      selector:
        select:
          options:
            - label: "Rapatrier vers Home Assistant uniquement"
              value: "download_only"
            - label: "Restauration complète du système"
              value: "full_restore"
